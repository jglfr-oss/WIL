<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What I've Learned</title>
<meta name="description" content="Stories from Dad.">
<meta name="theme-color" content="#241640">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#241640; --sky:#3a2766; --dusk:#5a3f8f; --ink:#0f0a1e;
    --gold:#e8b84a; --moon:#f2dfa0; --paper:#f5ecd6; --ember:#d9642e; --rose:#b04a6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--night);color:var(--paper);font-family:"Comic Neue","Comic Sans MS",cursive;font-size:18px;line-height:1.45}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}

  .hero{position:relative;border:4px solid var(--ink);overflow:hidden;background:var(--night)}
  .hero svg{display:block;width:100%;height:auto}
  .hero h1{position:absolute;left:0;right:0;top:22px;margin:0;text-align:center;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(40px,10vw,68px);line-height:.95;letter-spacing:3px;color:var(--paper);text-shadow:4px 4px 0 var(--ink)}
  .hero p{position:absolute;left:0;right:0;bottom:14px;margin:0;text-align:center;color:var(--moon);font-style:italic;font-size:18px;text-shadow:2px 2px 0 var(--ink)}

  .stories{display:grid;grid-template-columns:1fr;gap:16px;margin-top:22px}
  @media (min-width:560px){ .stories{grid-template-columns:1fr 1fr} }
  .card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease}
  .card:hover,.card:focus-visible{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink);outline:none}
  .card:active{transform:translate(2px,2px);box-shadow:4px 4px 0 var(--ink)}
  .card svg{display:block;width:100%;height:auto;border-bottom:4px solid var(--ink)}
  .card .body{padding:14px 16px 16px}
  .card .kicker{font-family:Anton,Impact,sans-serif;letter-spacing:3px;font-size:13px;color:var(--dusk)}
  .card h2{margin:2px 0 6px;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:32px;letter-spacing:1px;line-height:1}
  .card p{margin:0 0 10px;font-size:16px}
  .card .read{display:inline-block;background:var(--gold);border:3px solid var(--ink);padding:4px 12px;font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--ink)}

  footer{margin-top:36px;text-align:center;color:var(--gray,#a49fbf);font-size:14px;font-style:italic}
  @media (prefers-reduced-motion:no-preference){
    .sunglow{animation:breathe 7s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.6}}
  }
</style>
</head>
<body>
<div class="wrap">

        <path d="M401,310 L390,322 L378,322 L388,300 Z"/>
        <path d="M431,310 L440,322 L448,356 L456,352 L446,320 Z"/>
        <path d="M400,416 L392,440 L388,470 L400,470 L410,442 L412,420 Z"/>
        <path d="M428,416 L436,440 L442,470 L430,470 L420,442 L418,420 Z"/>
        <!-- joined hands -->
        <circle cx="380" cy="322" r="9"/>
        <!-- shadows -->
        <path d="M280,470 L356,470 L390,520 L220,520 Z" opacity=".55"/>
        <path d="M388,470 L442,470 L470,520 L360,520 Z" opacity=".55"/>
      </g>
    </svg>
    <h1>What I've Learned</h1>
    <p>Stories from Dad.</p>
  </section>

  <section class="stories" aria-label="Stories">

      <div class="body">
        <div class="kicker">STORY ONE</div>
        <h2>The Gold Wolf</h2>
        <p>A young wolf, his pack, and the night at the river when everyone else headed home.</p>
        <span class="read">Read it &rarr;</span>

  </section>

  <footer>For Hudson.</footer>
</div>
</body>
</html>
